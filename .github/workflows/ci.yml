name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# The three test jobs are intentionally independent so a late failure in one
# group does not wait for the other groups to finish. The `test` job below is
# the single aggregate status to keep required branch protection unchanged.
jobs:
  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      CI_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/holahola_ci
      NEON_SHARED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/holahola_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: holahola_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d holahola_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      # v5 actions run on Node 24 internally. The application itself remains
      # on Node 20 below, so the action-runtime deprecation warning is handled
      # independently from application test failures.
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Normalize Replit lockfile URLs for GitHub
        # Replit records some package tarballs through its internal npm proxy.
        # Their integrity hashes are the public npm tarballs' hashes, but the
        # proxy hostname is not resolvable from a GitHub-hosted runner.
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const lockfile = 'package-lock.json';
          const replitRegistry = 'http://package-firewall.replit.local/npm/';
          const publicRegistry = 'https://registry.npmjs.org/';
          const original = readFileSync(lockfile, 'utf8');
          const normalized = original.replaceAll(replitRegistry, publicRegistry);
          const replacements = original === normalized
            ? 0
            : original.split(replitRegistry).length - 1;

          if (replacements > 0) {
            writeFileSync(lockfile, normalized);
          }
          console.log(`[ci] normalized ${replacements} Replit npm proxy URL(s) for GitHub`);
          NODE

      - name: Install dependencies
        # `tsx` is a development dependency, and the tests must use this
        # checked-in toolchain instead of letting npx download an unrelated
        # temporary version.
        run: npm ci --include=dev

      - name: Verify local test runtime dependencies
        run: |
          test -x node_modules/.bin/tsx
          node --input-type=module -e "
            const { eq } = await import('drizzle-orm');
            if (typeof eq !== 'function') throw new Error('drizzle-orm did not expose eq');
            console.log('[ci] drizzle-orm resolves from the application import path');
          "

      - name: Prepare isolated CI database
        run: |
          npx tsx server/scripts/test-ci-database-adapter-guard.ts
          npx drizzle-kit migrate
          npx tsx server/scripts/setup-ci-test-database.ts

      - name: Run unit tests
        run: npm run test:ci:unit

  test-guards:
    name: Guard checks
    runs-on: ubuntu-latest
    env:
      CI_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/holahola_ci
      NEON_SHARED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/holahola_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: holahola_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d holahola_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Normalize Replit lockfile URLs for GitHub
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const lockfile = 'package-lock.json';
          const replitRegistry = 'http://package-firewall.replit.local/npm/';
          const publicRegistry = 'https://registry.npmjs.org/';
          const original = readFileSync(lockfile, 'utf8');
          const normalized = original.replaceAll(replitRegistry, publicRegistry);
          const replacements = original === normalized
            ? 0
            : original.split(replitRegistry).length - 1;

          if (replacements > 0) {
            writeFileSync(lockfile, normalized);
          }
          console.log(`[ci] normalized ${replacements} Replit npm proxy URL(s) for GitHub`);
          NODE

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify local test runtime dependencies
        run: |
          test -x node_modules/.bin/tsx
          node --input-type=module -e "
            const { eq } = await import('drizzle-orm');
            if (typeof eq !== 'function') throw new Error('drizzle-orm did not expose eq');
            console.log('[ci] drizzle-orm resolves from the application import path');
          "

      - name: Prepare isolated CI database
        run: |
          npx tsx server/scripts/test-ci-database-adapter-guard.ts
          npx drizzle-kit migrate
          npx tsx server/scripts/setup-ci-test-database.ts

      - name: Run guard checks
        run: npm run test:ci:guards

  test-episodes:
    name: Episode and North Star checks
    runs-on: ubuntu-latest
    env:
      CI_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/holahola_ci
      NEON_SHARED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/holahola_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: holahola_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d holahola_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Normalize Replit lockfile URLs for GitHub
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const lockfile = 'package-lock.json';
          const replitRegistry = 'http://package-firewall.replit.local/npm/';
          const publicRegistry = 'https://registry.npmjs.org/';
          const original = readFileSync(lockfile, 'utf8');
          const normalized = original.replaceAll(replitRegistry, publicRegistry);
          const replacements = original === normalized
            ? 0
            : original.split(replitRegistry).length - 1;

          if (replacements > 0) {
            writeFileSync(lockfile, normalized);
          }
          console.log(`[ci] normalized ${replacements} Replit npm proxy URL(s) for GitHub`);
          NODE

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify local test runtime dependencies
        run: |
          test -x node_modules/.bin/tsx
          node --input-type=module -e "
            const { eq } = await import('drizzle-orm');
            if (typeof eq !== 'function') throw new Error('drizzle-orm did not expose eq');
            console.log('[ci] drizzle-orm resolves from the application import path');
          "

      - name: Prepare isolated CI database
        run: |
          npx tsx server/scripts/test-ci-database-adapter-guard.ts
          npx drizzle-kit migrate
          npx tsx server/scripts/setup-ci-test-database.ts

      - name: Run episode and North Star checks
        run: npm run test:ci:episodes

  test:
    if: ${{ always() }}
    needs:
      - test-unit
      - test-guards
      - test-episodes
    runs-on: ubuntu-latest

    steps:
      - name: Report aggregate result
        env:
          UNIT_RESULT: ${{ needs.test-unit.result }}
          GUARDS_RESULT: ${{ needs.test-guards.result }}
          EPISODES_RESULT: ${{ needs.test-episodes.result }}
        run: |
          echo "[ci] unit tests: ${UNIT_RESULT}"
          echo "[ci] guard checks: ${GUARDS_RESULT}"
          echo "[ci] episode and North Star checks: ${EPISODES_RESULT}"

          if [[ "${UNIT_RESULT}" != "success" ||
                "${GUARDS_RESULT}" != "success" ||
                "${EPISODES_RESULT}" != "success" ]]; then
            echo "[ci] one or more test groups failed; see the named group job for the exact command"
            exit 1
          fi

          echo "[ci] all test groups passed"