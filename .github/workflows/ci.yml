name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # npm test runs npx tsx --test with an explicit file list that includes
        # client/src/components/floating-voice-widget-state.test.ts
        # (26 cases: computeWidgetLabel, computeWidgetClasses, deriveVoiceStatus).
        # Confirmed passing: 26/26 on 2026-07-31.
        run: npm test
